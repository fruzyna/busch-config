services:

  reverse-proxy:
    image: ${LSIO_REGISTRY}/swag
    container_name: reverse-proxy
    env_file: secrets/lets-encrypt.env
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=${USER_ID}
      - PGID=${USER_ID}
      - TZ=${TIMEZONE}
      - VALIDATION=http
      - URL=fruzyna.net
      - SUBDOMAINS=home,homepage,liam,metra,otd,races,rss,www
      - EXTRA_DOMAINS=docs.wildstang.dev,zone.wildstang.dev,frcwild.zone,2026.wildrank.app,test.wildrank.app
    volumes:
      - ./nginx:/config/nginx:Z
      - ./pages:/config/pages:Z
    ports:
      - 443:443
      - 80:80
    restart: always
