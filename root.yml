services:

  reverse-proxy:
    image: ${LSIO_REGISTRY}/swag
    container_name: reverse-proxy
    env_file: secrets/lets-encrypt.env
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=${USER_ID}
      - PGID=${USER_ID}
      - TZ=${TIMEZONE}
      - VALIDATION=dns
      - DNSPLUGIN=cloudflare
      - URL=305a.net
      - SUBDOMAINS=dav,finance,git,speed,stream,wiki
    volumes:
      - ./nginx:/config/nginx:Z
      - ./pages:/config/pages:Z
    ports:
      - 443:443
    restart: always

  cups:
    build: ./cups
    container_name: cups
    privileged: true
    volumes:
      - ${CONFIG_DIR}/cups:/etc/cups:Z
      - /var/run/dbus:/var/run/dbus:Z,ro
      - /dev/bus/usb/001:/dev/bus/usb/001:Z
    ports:
      - 631:631
    restart: always
